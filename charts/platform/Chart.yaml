apiVersion: v2
name: platform
description: Snicket Labs Platform Self Hosted
home: https://snicketlabs.io
version: 1.1.0
maintainers:
  - name: Snicket Labs Platform
    email: platform@snicketlabs.io
type: application
appVersion: "4.0.0"

dependencies:
  - name: kube-prometheus-stack
    version: 78.4.0
    repository: https://prometheus-community.github.io/helm-charts
    condition: monitoring.enabled
  - name: loki-stack
    version: 2.10.2
    repository: https://grafana.github.io/helm-charts
    condition: monitoring.logging.enabled
