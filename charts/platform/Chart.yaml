apiVersion: v2
name: platform
description: Snicket Labs Platform Self Hosted
home: https://snicketlabs.io
version: 3.0.0
maintainers:
  - name: Snicket Labs Platform
    email: platform@snicketlabs.io
type: application
appVersion: "4.0.0"

dependencies:
  - name: kube-prometheus-stack
    version: 93.4.1
    repository: https://prometheus-community.github.io/helm-charts
    condition: monitoring.enabled
  # Loki 3, single binary. The OSS chart moved from grafana/helm-charts (now
  # Enterprise-only) to grafana-community in March 2026.
  - name: loki
    version: 21.4.1
    repository: https://grafana-community.github.io/helm-charts
    condition: monitoring.logging.enabled
  # Ships pod logs to Loki. Replaces promtail, which is end-of-life.
  - name: alloy
    version: 1.16.0
    repository: https://grafana.github.io/helm-charts
    condition: monitoring.logging.enabled
