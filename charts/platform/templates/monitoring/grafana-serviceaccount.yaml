{{- $grafana := (index .Values "kube-prometheus-stack" | default dict).grafana | default dict -}}
{{- $sa := $grafana.serviceAccount | default dict -}}
{{- if and (include "platform.bundledGrafana" .) (not $sa.create) (eq ($sa.name | default "grafana") "grafana") }}
{{- /* Here rather than in the Grafana chart so monitoring.aws.grafanaRoleArn can annotate it. Any other name is an account you own. */}}
{{- $annotations := deepCopy ($sa.annotations | default dict) -}}
{{- with (.Values.monitoring.aws | default dict).grafanaRoleArn }}
{{- $_ := set $annotations "eks.amazonaws.com/role-arn" . -}}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  labels:
    {{- include "platform.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
