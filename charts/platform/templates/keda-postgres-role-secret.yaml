{{- if .Values.kedaAutoScaling.postgres.autoCreateRole }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platform.kedaPostgresRoleSecretName" . }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
  annotations:
    # The pre-upgrade database preparation Job (db-prepare-job.yaml) reads this
    # Secret for the KEDA role step, and Helm starts pre-upgrade hooks before
    # applying ordinary resources.
    # As a plain resource the Secret does not exist yet, and the Job sits in
    # CreateContainerConfigError until the upgrade times out — which is what
    # happens on the first upgrade from a Sidekiq-era release to GoodJob.
    #
    # Making it a hook one weight earlier than the Job fixes the ordering.
    # Fresh installs were never affected: db-prepare-initial.yaml is a plain
    # Job, so the Secret is applied alongside it. pre-install is listed
    # anyway so both paths create it the same way.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    # Helm creates hook resources rather than applying them, so the Secret has
    # to be deleted before it is re-created; with an empty policy every upgrade
    # failed with `secrets "..." already exists` (sc-24865). The same applies to
    # a reinstall, since uninstall leaves hook resources behind.
    #
    # The password survives: platform.kedaPostgresRolePassword looks the Secret
    # up when the chart is rendered, which is before Helm deletes it. Never add
    # hook-succeeded or hook-failed — keda-trigger-auth-postgres reads the
    # Secret at runtime long after the hook has finished.
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
data:
  password: {{ include "platform.kedaPostgresRolePassword" . | b64enc }}
{{- end }}
