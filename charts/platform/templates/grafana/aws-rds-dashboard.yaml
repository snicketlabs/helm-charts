{{- /* The host the KEDA scalers already read, so this follows kedaAutoScaling.postgres.host when it is set, as on installs that use dbPrimaryHostSecret. */ -}}
{{- $dbInstance := first (splitList "." (include "platform.kedaPostgresHost" .)) }}
{{- $dbRegex := "" }}{{- if $dbInstance }}{{- $dbRegex = printf "/^%s$/" $dbInstance }}{{- end }}
{{- if (.Values.monitoring.aws | default dict).enabled }}
