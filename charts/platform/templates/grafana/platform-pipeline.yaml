{{- if include "platform.dashboardsEnabled" . }}
{{- $fullname := include "platform.fullname" . }}
{{- /* Workloads come from the chart's own values, so a job added or dropped
       there needs no edit here. The hand-written list this replaces matched
       none of the matchcore tiers (sc-25669). Pods are named
       <workload>-<fullname>-<suffix>; the workload is the part before the
       fullname. Sorted so the variable and its options never reorder. */ -}}
{{- $workloads := list }}
{{- range $name, $job := .Values.scaledJobs }}
{{- if $job.enabled }}
{{- $workloads = append $workloads $name }}
{{- end }}
{{- end }}
{{- range $name, $worker := .Values.scaledObjects }}
{{- $workloads = append $workloads (printf "%s-worker" $name) }}
{{- end }}
{{- $workloads = append $workloads "web" }}
{{- if eq .Values.railsConsole.enabled true }}
{{- $workloads = append $workloads "rails-console" }}
{{- end }}
{{- $workloads = sortAlpha $workloads }}
{{- $workloadQuery := join "," $workloads }}
