{{- if include "platform.postgresDashboardsEnabled" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-postgres
  labels:
    grafana_dashboard: "1"
data:
  postgres.json: |
    {"id":null,"uid":"platform-postgres","title":"PostgreSQL","tags":["postgresql"],"timezone":"browser","schemaVersion":37,"version":1,"refresh":"1m","panels":[{"type":"timeseries","title":"Active Connections","datasource":"Postgres","targets":[{"format":"time_series","rawSql":"SELECT now() as time, count(*) as connections FROM pg_stat_activity;","refId":"A"}],"fieldConfig":{"defaults":{"unit":"short"}},"gridPos":{"h":4,"w":8,"x":0,"y":0}},{"type":"table","title":"Oldest running job by queue","description":"How long the oldest job that has been claimed and not finished has been running, per queue. A snapshot of in-flight work, not history.\n\nReads good_jobs rather than pg_stat_activity: the grafana role cannot see other sessions' query text, so a query-text panel would come back empty.","datasource":"Postgres","targets":[{"format":"table","rawSql":"SELECT queue_name, extract(epoch from (now() - min(performed_at))) AS oldest_running_seconds FROM good_jobs WHERE finished_at IS NULL AND locked_by_id IS NOT NULL AND performed_at IS NOT NULL GROUP BY queue_name ORDER BY oldest_running_seconds DESC;","refId":"B"}],"fieldConfig":{"defaults":{"unit":"s"}},"gridPos":{"h":4,"w":8,"x":8,"y":0}},{"type":"table","title":"Database Sizes","datasource":"Postgres","targets":[{"format":"table","rawSql":"SELECT pg_database.datname AS database, pg_size_pretty(pg_database_size(pg_database.datname)) AS size FROM pg_database WHERE pg_database.datname = current_database() ORDER BY pg_database_size(pg_database.datname) DESC;","refId":"C"}],"gridPos":{"h":4,"w":8,"x":0,"y":4}},{"type":"table","title":"Table Sizes","datasource":"Postgres","targets":[{"format":"table","rawSql":"SELECT relname AS table, pg_size_pretty(pg_total_relation_size(relid)) AS total_size FROM pg_catalog.pg_statio_user_tables ORDER BY pg_total_relation_size(relid) DESC;","refId":"D"}],"gridPos":{"h":4,"w":8,"x":8,"y":4}},{"type":"stat","title":"Cache Hit Ratio (%)","datasource":"Postgres","targets":[{"format":"table","rawSql":"SELECT round((sum(blks_hit) / nullif(sum(blks_hit) + sum(blks_read),0)) * 100, 2) AS cache_hit_pct FROM pg_stat_database;","refId":"E"}],"fieldConfig":{"defaults":{"unit":"percent"}},"gridPos":{"h":2,"w":4,"x":0,"y":8}},{"type":"stat","title":"Deadlocks (since stats reset)","description":"Cumulative for this database since the last statistics reset. It is not a last-hour figure.","datasource":"Postgres","targets":[{"format":"table","rawSql":"SELECT sum(deadlocks) AS deadlocks FROM pg_stat_database WHERE datname = current_database();","refId":"F"}],"fieldConfig":{"defaults":{"unit":"short"}},"gridPos":{"h":2,"w":4,"x":4,"y":8}},{"type":"table","title":"Locks (Not Granted)","datasource":"Postgres","targets":[{"format":"table","rawSql":"SELECT pid, locktype, relation::regclass, mode, granted FROM pg_locks WHERE NOT granted;","refId":"G"}],"gridPos":{"h":4,"w":8,"x":8,"y":8}},{"type":"table","title":"Top Tables by Sequential Scans","description":"Cumulative since the last statistics reset.","datasource":"Postgres","targets":[{"format":"table","rawSql":"SELECT relname AS table, seq_scan FROM pg_stat_user_tables ORDER BY seq_scan DESC LIMIT 10;","refId":"H"}],"gridPos":{"h":4,"w":8,"x":0,"y":12}},{"type":"table","title":"Top Tables by Index Scans","description":"Cumulative since the last statistics reset.","datasource":"Postgres","targets":[{"format":"table","rawSql":"SELECT relname AS table, idx_scan FROM pg_stat_user_tables ORDER BY idx_scan DESC LIMIT 10;","refId":"I"}],"gridPos":{"h":4,"w":8,"x":8,"y":12}},{"type":"table","title":"Dead tuples by table","description":"Rows left behind by updates and deletes, awaiting vacuum (n_dead_tup). A count of dead rows, not a bloat estimate.","datasource":"Postgres","targets":[{"format":"table","rawSql":"SELECT schemaname, relname, n_dead_tup FROM pg_stat_user_tables ORDER BY n_dead_tup DESC LIMIT 10;","refId":"M"}],"gridPos":{"h":4,"w":8,"x":0,"y":16}},{"type":"table","title":"Oldest waiting job by queue","description":"How long the oldest unclaimed job on each queue has been runnable. Depth says work arrived; this says whether it is moving. A queue that is deep and draining looks the same as one that is stuck until you look here.\n\nMatches what the KEDA scaler counts -- unfinished, unclaimed, and past its scheduled time -- so this and the queue depth panel on the pipeline dashboard describe the same rows.\n\nClimbing across every queue at once usually means the database, not the workers. See the sizing guidance in the chart docs.","datasource":"Postgres","targets":[{"format":"table","rawSql":"SELECT queue_name, extract(epoch from (now() - min(scheduled_at))) AS oldest_seconds FROM good_jobs WHERE finished_at IS NULL AND locked_by_id IS NULL AND scheduled_at <= now() GROUP BY queue_name ORDER BY oldest_seconds DESC;","refId":"N"}],"fieldConfig":{"defaults":{"unit":"s"}},"gridPos":{"h":6,"w":16,"x":0,"y":20}}]}
{{- end }}
