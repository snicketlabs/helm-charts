{{- if (.Values.monitoring.aws | default dict).enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-cloudwatch-datasource
  labels:
    grafana_datasource: "1"
data:
  cloudwatch-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: CloudWatch
        type: cloudwatch
        access: proxy
        isDefault: false
        jsonData:
          authType: assume_role
          defaultRegion: {{ required "monitoring.aws.region is required when monitoring.aws is enabled. Set it to the region your RDS instance is in, e.g. eu-west-2" .Values.monitoring.aws.region | quote }}
          assumeRoleArn: {{ required "monitoring.aws.cloudwatchRoleArn is required when monitoring.aws is enabled. Set it to the IAM role Grafana should assume to read CloudWatch, e.g. arn:aws:iam::<account>:role/<cluster>-grafana-cloudwatch" .Values.monitoring.aws.cloudwatchRoleArn | quote }}
{{- end }}
