{{- if and .Values.monitoring.awsDashboards (default false .Values.monitoring.awsDashboards.enabled) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-cloudwatch-datasource
  labels:
    grafana_datasource: "1"
data:
  cloudwatch-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: CloudWatch
        type: cloudwatch
        access: proxy
        isDefault: false
        jsonData:
          authType: assume_role
          defaultRegion: {{ required "monitoring.awsDashboards.cloudwatch.defaultRegion is required when monitoring.awsDashboards is enabled. Set it to the region your RDS instance is in, e.g. eu-west-2" .Values.monitoring.awsDashboards.cloudwatch.defaultRegion | quote }}
          assumeRoleArn: {{ required "monitoring.awsDashboards.cloudwatch.assumeRoleArn is required when monitoring.awsDashboards is enabled. Set it to the IAM role Grafana should assume to read CloudWatch, e.g. arn:aws:iam::<account>:role/<cluster>-grafana-cloudwatch" .Values.monitoring.awsDashboards.cloudwatch.assumeRoleArn | quote }}
{{- end }}
