    activeDeadlineSeconds: 6600 # 110 minutes

service:
  type: ClusterIP
  port: 3000
  annotations: {}

# HTTP/non-TLS access — for on-prem clusters without ingress/TLS termination.
# Leave unset for standard HTTPS production deployments.
# snicketProtocol sets SNICKET_PROTOCOL in all pods (e.g. "http").
# snicketPort sets SNICKET_PORT (optional — defaults to 80 when protocol is http).
snicketProtocol: ""
snicketPort: ""

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

  # EKS Auto Mode: creates an IngressClassParams resource to configure ALB behaviour.
  # Standard ALB annotations (e.g. load-balancer-attributes) are not supported in
  # EKS Auto Mode — use this block instead.
  # Set create: true only when the cluster uses EKS Auto Mode and ingress.className is set.
  # IngressClassParams is cluster-scoped; do not enable if sharing a className with
  # other environments on the same cluster.
  ingressClassParams:
    create: false
    scheme: internet-facing
    loadBalancerAttributes: []

# Gateway API HTTPRoute — cloud-agnostic alternative to ingress for
# Gateway-API clusters (GKE, on-prem). The Gateway itself is cluster infra (owns
# the LB IP, GatewayClass, and TLS cert); this route just attaches to it.
# Disabled by default so AWS keeps using `ingress` above. Enable EITHER ingress
# OR httpRoute, not both.
httpRoute:
  enabled: false
  annotations: {}
  # The infra-owned Gateway to attach to. Omit namespace when the Gateway is in
  # the same namespace as this release (no ReferenceGrant needed). Set
  # sectionName to bind a specific listener (e.g. "https").
  parentRefs:
    - name: gateway
      # namespace: ""
      # sectionName: ""
  # Hostnames this route answers for. Empty = match all hosts on the listener
  # (useful before a real domain/cert exists). Set to the app domain once TLS is on.
  hostnames: []
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # backendRef is always the web Service (platform) on service.port.

# GKE-specific extras. Enable on GKE Gateway clusters. Currently adds
# a HealthCheckPolicy so the GKE Gateway health-checks the app's /up endpoint —
# GKE otherwise defaults the backend health check to "/", which the app
# 302-redirects, marking the backend unhealthy. Off everywhere else (the
# HealthCheckPolicy CRD is GKE-only).
gke:
  enabled: false
  healthCheckPath: /up

nodeSelector: {}

tolerations: []

affinity: {}

# Additional environment variables for the application
env: []
  # - name: EXAMPLE_VAR
  #   value: "example_value"

# Initial user configuration for seeding
adminUser:
  email: "admin@snicketlabs.io"
  firstName: "Admin"
  lastName: "User"
  roles: "email_and_password,assure_admin"
  organisationName: "Snicket Labs"
  organisationRoles: "assure_admin"

# Postgres connection. The chart does not provision a database — point it at one
# you run yourself (RDS, CloudNativePG, or any reachable Postgres).
#
# REQUIRED: the host, either as primaryHost below or as dbPrimaryHostSecret.
# Rendering fails with a named error if neither is set, rather than installing
# something that cannot reach a database.
postgres:
  primaryHost: "" # e.g. my-db.eu-west-2.rds.amazonaws.com
  port: 5432
  auth:
    username: "platform"
    database: "platform"
    # Prefer passwordSecret below over a literal password here.
    password: ""
  # Read any of these from a Secret instead of the plain values above. Each is
  # independent — use as many or as few as suit how your credentials are stored.
  # passwordSecret:
  #   name: "my-pg-secret"
  #   key: "password"
  # userNameSecret:
  #   name: "my-pg-secret"
  #   key: "username"
  # dbNameSecret:
  #   name: "my-pg-secret"
  #   key: "db_name"
  # dbPrimaryHostSecret:
  #   name: "my-pg-secret"
  #   key: "host"
  # dbPortSecret:
  #   name: "my-pg-secret"
  #   key: "port"
  #
  # With dbPrimaryHostSecret the chart cannot work the host out at render time,
  # so kedaAutoScaling.postgres.host has to be set explicitly as well.

# S3 Configuration
s3:
  # Both of these are REQUIRED and deliberately have no default: the previous
  # defaults ("adsignal-primary-bucket" and "us-east-1") were plausible enough
  # to deploy cleanly while pointing at the wrong bucket and the wrong region.
  # Rendering now fails with a named error rather than starting something that
  # quietly misbehaves.
  primaryBucket: ""   # REQUIRED → S3_PRIMARY_BUCKET. The bucket this deployment uses for primary storage
  region: ""          # REQUIRED → COMPATIBLE_S3_REGION, AWS_REGION. The region your bucket and cluster are in, e.g. eu-west-2
  accessKeyId: "dummy-key"                  # unused — kept for backwards compat; use compatibleCredentialsSecret
  secretAccessKey: "dummy-secret"           # unused — kept for backwards compat; use compatibleCredentialsSecret

  # S3-compatible backend (GCS, Ceph, MinIO, etc.).
  # Leave all empty on AWS — IRSA and the default S3 endpoint are used.
  compatibleEndpoint: ""        # → COMPATIBLE_ENDPOINT_URL_S3 — internal pod→storage URL
                                #   e.g. https://storage.googleapis.com or http://ceph-rgw.svc:80
  compatiblePublicEndpoint: ""  # → COMPATIBLE_PUBLIC_ENDPOINT_URL_S3 — browser-reachable URL;
                                #   only needed when the internal endpoint is not reachable by browsers
                                #   (e.g. on-prem Ceph behind MetalLB). Omit to use compatibleEndpoint.
  compatibleCredentialsSecret: "" # → COMPATIBLE_S3_ACCESS_KEY / COMPATIBLE_S3_SECRET_KEY
                                  #   (name of a k8s Secret, e.g. s3-credentials)
  compatibleAccessKeyField: ""  # key name within the secret for the access key (default: access_key_id)
  compatibleSecretKeyField: ""  # key name within the secret for the secret key (default: secret_access_key)
  compatibleForcePathStyle: ""  # → COMPATIBLE_S3_FORCE_PATH_STYLE — "true" or "false" (default: "true")
                                #   required by Ceph, MinIO, and GCS S3 interop; only override if your
                                #   store explicitly uses virtual-hosted style URLs

domain: snicketlabs.example.com

monitoring:
  # The one switch most deployments need. Installs the kube-prometheus-stack
  # subchart (Prometheus, Grafana, the Operator CRDs), and every dashboard
  # below follows it unless you say otherwise.
  enabled: false

  # Loki 3 and Alloy, with a Grafana datasource. Pinned in the loki: and
  # alloy: blocks below.
  logging:
    enabled: false

  # The three dashboard flags are unset rather than false on purpose: unset
  # means "follow monitoring.enabled", so turning monitoring on gets you
  # working dashboards without naming each one. Set true or false to override.
  #
  # The datasource-backed ones do not switch themselves on for a Grafana we did
  # not install, because we cannot wire its password mount and Grafana will not
  # start with a datasource it cannot provision. Running your own Grafana? Set
  # them true deliberately and mount the password yourself -- MONITORING.md.

  # Pipeline overview: queues, pod CPU and memory, OOM kills, throttling.
  dashboards:
    enabled:
  # Match-specific dashboards. Currently the per-tier view of the matchcore
  # fingerprinting jobs: what is running now and against which material, wall
  # time per minute of source, and the CPU, throttling and memory each tier
  # actually uses against its envelope. Reads the job tables through the
  # Postgres datasource, so unset follows postgresDashboards.
  matchDashboards:
    enabled:
  # Postgres datasource and the GoodJob table dashboards. The datasource uses
  # the KEDA read-only role (db_keda_ro), not the application's own database
  # credentials -- Grafana's Postgres datasource runs arbitrary SQL from
  # Explore.
  #
  # Unset turns this on only when we install Grafana AND
  # kedaAutoScaling.postgres.autoCreateRole is on, which together mean the
  # password exists and the mount is ours to make
  # (kube-prometheus-stack.grafana.extraSecretMounts, below).
  postgresDashboards:
    enabled:
    # The datasource's own read-only role, created and converged by the same
    # database preparation Job as KEDA's. Deliberately separate from db_keda_ro:
    # the two want different tables, and dashboards quietly depending on a role
    # named for KEDA is how this went wrong the first time (sc-25626).
    #
    # Gets SELECT on good_jobs, good_job_processes, jobs, ingest_masters and
    # materials -- what the dashboards read. Still far short of the application's
    # own user, which is what this datasource used to run as.
    #
    # autoCreateRole false leaves the role to you; grant it SELECT on those
    # tables and mount its password into Grafana yourself. A missing grant never
    # fails the install, it just leaves those panels with a permissions error.
    roleName: db_grafana_ro
    autoCreateRole: true
  # CloudWatch datasource, RDS dashboards and Grafana's IAM role.
  aws:
    enabled: false
    # IRSA role annotated on Grafana's service account. Optional.
    grafanaRoleArn: ""
    # Required. Role the CloudWatch datasource assumes.
    cloudwatchRoleArn: ""
    # Required. Region of your RDS instance.
    region: ""
  # Prometheus alert rules, rendered as a PrometheusRule (needs the Prometheus
  # Operator CRDs: installed by monitoring.enabled, or bring your own).
  # PlatformTaskPodOOMKilled fires when a scaledJobs (oneAndDone) pod is killed
  # for exceeding its memory limit. The application only sees an interruption
  # and retries it, so without this alert an out-of-memory source quietly burns
  # every retry. Alertmanager is not configured by this chart: route the alert
  # with your own Alertmanager, or view it in Grafana / Prometheus.
  alerts:
    enabled: false
    # Extra labels on the PrometheusRule object, for a Prometheus whose
    # ruleSelector needs them. The bundled kube-prometheus-stack needs none:
    # the rule always carries release: <release name>.
    ruleLabels: {}
    # Extra labels on every alert (e.g. team, or a severity override for routing).
    alertLabels: {}
    # How long an OOM kill keeps the alert firing. The killed pod and its
    # metric can be gone within a minute on autoscaled clusters.
    oomKilledWindow: 15m

# Subchart values. These are ROOT keys named after the dependency, installed
# when monitoring.enabled (kube-prometheus-stack) and monitoring.logging.enabled
# (loki, alloy) are set. Nesting them under monitoring: is silently ignored.
kube-prometheus-stack:
  # Upgrades the Prometheus Operator CRDs on every upgrade, which Helm alone
  # does not.
  crds:
    upgradeJob:
      enabled: true
  # Not configured by this chart; route alerts with your own Alertmanager.
  alertmanager:
    enabled: false
  # Bundled dashboards and scrapes this chart does not use. Each switch is the
  # subchart's own, so the dashboard and its ServiceMonitor go together.
  #
  # EKS Auto Mode runs CoreDNS, kube-proxy and the control plane outside the
  # cluster, so these targets never resolve and their dashboards stay empty.
  # Off here for every install, since this chart does not run those components.
  coreDns:
    enabled: false
  kubeProxy:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeControllerManager:
    enabled: false
  # Node-exporter dashboards for macOS and AIX. Linux stays on.
  nodeExporter:
    operatingSystems:
      darwin:
        enabled: false
      aix:
        enabled: false
  grafana:
    persistence:
      enabled: true
      type: pvc
      accessModes:
        - ReadWriteOnce
      size: 10Gi
    # A ReadWriteOnce volume cannot attach to the new pod until the old one
    # lets go.
    deploymentStrategy:
      type: Recreate
    # Empty, not omitted: omitting it inherits the published "prom-operator".
    # Empty makes Grafana generate a password on install and keep it on upgrade.
    # See "Grafana admin password" in MONITORING.md.
    adminPassword: ""

    # Rendered by this chart (create: false) so monitoring.aws.grafanaRoleArn
    # can annotate it. The name is fixed for IRSA trust policies.
    serviceAccount:
      create: false
      name: grafana
      annotations: {}

    # Grafana is served at /grafana on the platform's host. root_url comes
    # from the ConfigMap below, written when the route is on.
    grafana.ini:
      server:
        serve_from_sub_path: true
    envFromConfigMaps:
      - name: '{{ .Release.Name }}-grafana-server'
        optional: true

    # Namespaced RBAC: a Role in Grafana's namespace instead of a ClusterRole
    # granting get/watch/list on configmaps and secrets in EVERY namespace,
    # which is the subchart default.
    #
    # Set this back to false if you point any sidecar.*.searchNamespace at
    # another namespace; a namespaced Role cannot read it.
    rbac:
      namespaced: true
    # Grafana's own namespace. kube-prometheus-stack's default, ALL, is
    # forbidden under the namespaced Role, so no dashboards load.
    sidecar:
      dashboards:
        searchNamespace: ""

    # Grafana's read-only role password, which the Postgres datasource reads as
    # $__env{PLATFORM_GRAFANA_PG_PASSWORD} when monitoring.postgresDashboards is
    # enabled. An environment variable rather than a file: every upgrade recreates
    # the Secret, and a file that briefly disappears made Grafana re-provision its
    # datasource with no password. An env var is read at pod start, so the Secret
    # being recreated cannot reach Grafana.
    #
    # optional: true so the variable is simply unset when the Secret is absent
    # (autoCreateRole: false), rather than Grafana sitting in CreateContainerConfigError.
    #
    # Helm replaces maps wholesale here too: if you set envValueFrom yourself,
    # restate this entry.
    #
    # Bringing your own Grafana? This does nothing for you -- set the variable
    # there yourself. See MONITORING.md.
    envValueFrom:
      PLATFORM_GRAFANA_PG_PASSWORD:
        secretKeyRef:
          name: platform-grafana-postgres-ro
          key: password
          optional: true
  prometheus:
    prometheusSpec:
      # Without this Prometheus keeps its data on an emptyDir.
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 50Gi
      # Scrape the chart's PodMonitors. With the subchart's default an empty
      # selector means "only objects labelled release: <release>", which the
      # PodMonitors do not carry, so metrics.enabled rendered PodMonitors that
      # nothing scraped.
      podMonitorSelectorNilUsesHelmValues: false
      # Same again for ServiceMonitors, so KEDA's own ServiceMonitor is picked
      # up. keda_scaler_metrics_value is the chart's only source of queue depth
      # and KEDA is installed separately, so its ServiceMonitor is created by
      # KEDA's chart (prometheus.operator.serviceMonitor.enabled) in KEDA's
      # namespace and carries none of our release labels. Without this the
      # pipeline dashboards are empty and nothing says why.
      serviceMonitorSelectorNilUsesHelmValues: false

# Loki 3, one pod on a PersistentVolume. Usual overrides:
# singleBinary.persistence (size, storageClass) and
# loki.limits_config.retention_period.
loki:
  # <release>-logs: loki-stack's StatefulSet was <release>-loki, and reusing
  # the name fails the upgrade.
  nameOverride: logs
  deploymentMode: Monolithic
  rbac:
    namespaced: true
  loki:
    auth_enabled: false
    configObjectName: '{{ include "loki.fullname" . }}'
    generatedConfigObjectName: '{{ include "loki.fullname" . }}'
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2026-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    # Needed by Logs Drilldown.
    pattern_ingester:
      enabled: true
    limits_config:
      volume_enabled: true
      allow_structured_metadata: true
      discover_log_levels: true
      retention_period: 744h  # 31d
    compactor:
      retention_enabled: true
      delete_request_store: filesystem
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      storageClass: ""  # cluster default
      size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  gateway:
    enabled: false
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  memcached:
    enabled: false
  lokiCanary:
    enabled: false
  test:
    enabled: false
  sidecar:
    rules:
      enabled: false

# Alloy, a DaemonSet shipping every pod's logs to Loki.
alloy:
  crds:
    create: false
  controller:
    type: daemonset
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
  alloy:
    mounts:
      varlog: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
    # Same labels as promtail set, so existing queries keep working.
    configMap:
      content: |-
        discovery.kubernetes "pods" {
          role = "pod"
          selectors {
            role  = "pod"
            field = "spec.nodeName=" + sys.env("HOSTNAME")
          }
        }

        discovery.relabel "pods" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_node_name"]
            target_label  = "node_name"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app"]
            regex         = "^;*([^;]+)(;.*)?$"
            target_label  = "app"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component", "__meta_kubernetes_pod_label_component"]
            regex         = "^;*([^;]+)(;.*)?$"
            target_label  = "component"
          }
          rule {
            source_labels = ["namespace", "app"]
            separator     = "/"
            target_label  = "job"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
            separator     = "/"
            target_label  = "__path__"
            replacement   = "/var/log/pods/*$1/*.log"
          }
        }

        local.file_match "pods" {
          path_targets = discovery.relabel.pods.output
        }

        loki.source.file "pods" {
          targets    = local.file_match.pods.targets
          forward_to = [loki.process.pods.receiver]
        }

        loki.process "pods" {
          stage.cri {}
          forward_to = [loki.write.default.receiver]
        }

        loki.write "default" {
          endpoint {
            url = "http://{{ include "platform.lokiName" . }}:3100/loki/api/v1/push"
          }
        }

materialProcessingPipelines: "default|duration>=0"
materialProcessingCount: "default=5"
