service:
  type: ClusterIP
  port: 3000
  annotations: {}

# HTTP/non-TLS access — for on-prem clusters without ingress/TLS termination.
# Leave unset for standard HTTPS production deployments.
# snicketProtocol sets SNICKET_PROTOCOL in all pods (e.g. "http").
# snicketPort sets SNICKET_PORT (optional — defaults to 80 when protocol is http).
snicketProtocol: ""
snicketPort: ""

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

  # EKS Auto Mode: creates an IngressClassParams resource to configure ALB behaviour.
  # Standard ALB annotations (e.g. load-balancer-attributes) are not supported in
  # EKS Auto Mode — use this block instead.
  # Set create: true only when the cluster uses EKS Auto Mode and ingress.className is set.
  # IngressClassParams is cluster-scoped; do not enable if sharing a className with
  # other environments on the same cluster.
  ingressClassParams:
    create: false
    scheme: internet-facing
    loadBalancerAttributes: []

# Gateway API HTTPRoute — cloud-agnostic alternative to ingress for
# Gateway-API clusters (GKE, on-prem). The Gateway itself is cluster infra (owns
# the LB IP, GatewayClass, and TLS cert); this route just attaches to it.
# Disabled by default so AWS keeps using `ingress` above. Enable EITHER ingress
# OR httpRoute, not both.
httpRoute:
  enabled: false
  annotations: {}
  # The infra-owned Gateway to attach to. Omit namespace when the Gateway is in
  # the same namespace as this release (no ReferenceGrant needed). Set
  # sectionName to bind a specific listener (e.g. "https").
  parentRefs:
    - name: gateway
      # namespace: ""
      # sectionName: ""
  # Hostnames this route answers for. Empty = match all hosts on the listener
  # (useful before a real domain/cert exists). Set to the app domain once TLS is on.
  hostnames: []
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # backendRef is always the web Service (platform) on service.port.

# GKE-specific extras. Enable on GKE Gateway clusters. Currently adds
# a HealthCheckPolicy so the GKE Gateway health-checks the app's /up endpoint —
# GKE otherwise defaults the backend health check to "/", which the app
# 302-redirects, marking the backend unhealthy. Off everywhere else (the
# HealthCheckPolicy CRD is GKE-only).
gke:
  enabled: false
  healthCheckPath: /up

nodeSelector: {}

tolerations: []

affinity: {}

# Additional environment variables for the application
env: []
  # - name: EXAMPLE_VAR
  #   value: "example_value"

# Initial user configuration for seeding
adminUser:
  email: "admin@snicketlabs.io"
  firstName: "Admin"
  lastName: "User"
  roles: "email_and_password,assure_admin"
  organisationName: "Snicket Labs"
  organisationRoles: "assure_admin"

# Postgres connection. The chart does not provision a database — point it at one
# you run yourself (RDS, CloudNativePG, or any reachable Postgres).
#
# REQUIRED: the host, either as primaryHost below or as dbPrimaryHostSecret.
# Rendering fails with a named error if neither is set, rather than installing
# something that cannot reach a database.
postgres:
  primaryHost: "" # e.g. my-db.eu-west-2.rds.amazonaws.com
  port: 5432
  auth:
    username: "platform"
    database: "platform"
    # Prefer passwordSecret below over a literal password here.
    password: ""
  # Read any of these from a Secret instead of the plain values above. Each is
  # independent — use as many or as few as suit how your credentials are stored.
  # passwordSecret:
  #   name: "my-pg-secret"
  #   key: "password"
  # userNameSecret:
  #   name: "my-pg-secret"
  #   key: "username"
  # dbNameSecret:
  #   name: "my-pg-secret"
  #   key: "db_name"
  # dbPrimaryHostSecret:
  #   name: "my-pg-secret"
  #   key: "host"
  # dbPortSecret:
  #   name: "my-pg-secret"
  #   key: "port"
  #
  # With dbPrimaryHostSecret the chart cannot work the host out at render time,
  # so kedaAutoScaling.postgres.host has to be set explicitly as well.

# S3 Configuration
s3:
  # Both of these are REQUIRED and deliberately have no default: the previous
  # defaults ("adsignal-primary-bucket" and "us-east-1") were plausible enough
  # to deploy cleanly while pointing at the wrong bucket and the wrong region.
  # Rendering now fails with a named error rather than starting something that
  # quietly misbehaves.
  primaryBucket: ""   # REQUIRED → S3_PRIMARY_BUCKET. The bucket this deployment uses for primary storage
  region: ""          # REQUIRED → COMPATIBLE_S3_REGION, AWS_REGION. The region your bucket and cluster are in, e.g. eu-west-2
  accessKeyId: "dummy-key"                  # unused — kept for backwards compat; use compatibleCredentialsSecret
  secretAccessKey: "dummy-secret"           # unused — kept for backwards compat; use compatibleCredentialsSecret

  # S3-compatible backend (GCS, Ceph, MinIO, etc.).
  # Leave all empty on AWS — IRSA and the default S3 endpoint are used.
  compatibleEndpoint: ""        # → COMPATIBLE_ENDPOINT_URL_S3 — internal pod→storage URL
                                #   e.g. https://storage.googleapis.com or http://ceph-rgw.svc:80
  compatiblePublicEndpoint: ""  # → COMPATIBLE_PUBLIC_ENDPOINT_URL_S3 — browser-reachable URL;
                                #   only needed when the internal endpoint is not reachable by browsers
                                #   (e.g. on-prem Ceph behind MetalLB). Omit to use compatibleEndpoint.
  compatibleCredentialsSecret: "" # → COMPATIBLE_S3_ACCESS_KEY / COMPATIBLE_S3_SECRET_KEY
                                  #   (name of a k8s Secret, e.g. s3-credentials)
  compatibleAccessKeyField: ""  # key name within the secret for the access key (default: access_key_id)
  compatibleSecretKeyField: ""  # key name within the secret for the secret key (default: secret_access_key)
  compatibleForcePathStyle: ""  # → COMPATIBLE_S3_FORCE_PATH_STYLE — "true" or "false" (default: "true")
                                #   required by Ceph, MinIO, and GCS S3 interop; only override if your
                                #   store explicitly uses virtual-hosted style URLs

domain: snicketlabs.example.com

monitoring:
  enabled: false
  dashboards:
    enabled: false
  # Match-specific dashboards. Currently the per-tier view of the matchcore
  # fingerprinting jobs: what is running now and against which material, wall
  # time per minute of source, and the CPU, throttling and memory each tier
  # actually uses against its envelope. Needs the Postgres datasource
  # (monitoring.postgresDashboards) for the job tables.
  matchDashboards:
    enabled: false

# Subchart values. These are ROOT keys named after the dependency, installed
# when monitoring.enabled (kube-prometheus-stack) and monitoring.logging.enabled
# (loki-stack) are set. Nesting them under monitoring: is silently ignored.
kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      # Scrape the chart's PodMonitors. With the subchart's default an empty
      # selector means "only objects labelled release: <release>", which the
      # PodMonitors do not carry, so metrics.enabled rendered PodMonitors that
      # nothing scraped.
      podMonitorSelectorNilUsesHelmValues: false

materialProcessingPipelines: "default|duration>=0"
materialProcessingCount: "default=5"
